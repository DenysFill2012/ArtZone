<!DOCTYPE html>

  <title>ArtZone — Наші Арти</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f9f7f7, #c9e4de);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      color: #222;
      margin-bottom: 10px;
      animation: fadeIn 1s ease-out;
    }

    p {
      font-size: 16px;
      color: #555;
      margin-bottom: 20px;
      animation: fadeIn 1.5s ease-out;
    }

    .btn-container {
      display: flex;
      gap: 12px;
      animation: fadeIn 2s ease-out;
      margin-bottom: 20px;
    }

    .btn {
      padding: 10px 25px;
      font-size: 16px;
      background: #ff7f50;
      color: white;
      border: none;
      border-radius: 10px;
      text-decoration: none;
      transition: 0.3s;
      box-shadow: 0 5px 15px rgba(255, 127, 80, 0.4);
    }

    .btn:hover {
      background: #ff6333;
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(255, 99, 51, 0.6);
    }

    .btn:active {
      transform: scale(0.98);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* три колонки */
      gap: 15px;
      margin-top: 20px;
      max-width: 700px; /* обмеження ширини для центрування */
    } 


    .gallery img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      transition: transform 0.3s ease-in-out;
    }

    .gallery img:hover {
      transform: scale(1.08);
      cursor: pointer;
    }

    .back-btn {
      margin-top: 20px;
      padding: 8px 16px;
      font-size: 14px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      text-decoration: none;
      transition: 0.3s;
      box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
    }

    .back-btn:hover {
      background: #388E3C;
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(56, 142, 60, 0.6);
    }
  </style>
</head>
